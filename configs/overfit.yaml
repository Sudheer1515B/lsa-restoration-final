# Tiny diagnostic run: invoke with --overfit-samples 8 to verify learning.
seed: 42

paths:
  train_degraded_dir: data/kla/train/degraded
  train_ground_truth_dir: data/kla/train/ground_truth
  validation_degraded_dir: null
  validation_ground_truth_dir: null
  exclude_train_ids_file: null
  checkpoint_dir: checkpoints/overfit
  output_dir: outputs/overfit

data:
  scale_factor: 2
  floating_point_scale: 1.0
  metric_data_range: 1.0
  validation_fraction: 0.15
  crop_size_lr: 128
  geometric_augment: false
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1
  scale_factor: 2
  width: 16
  enc_blocks: [1, 1]
  middle_blocks: 2
  dec_blocks: [1, 1]

loss:
  lambda_ssim: 0.2

training:
  epochs: 50
  batch_size: 2
  learning_rate: 0.001
  min_learning_rate: 0.00001
  weight_decay: 0.0
  amp: false
