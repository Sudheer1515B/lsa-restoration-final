# LPIPS fine-tune stage, launched by resuming from medium_nafnet_a's epoch-80
# checkpoint (checkpoints/medium_nafnet_a/best_psnr.pth) rather than training
# from scratch. See docs/methodology.md for the full rationale and results.
#
# medium_nafnet_a's pre-fine-tune numbers (genuine held-out split): PSNR
# 29.14 dB, SSIM 0.8283, LPIPS 0.2506. LPIPS is graded
# (PROBLEM_STATEMENT_1.md Slide 6) and the training objective below
# (Charbonnier + SSIM + Sobel) is entirely smoothness/structure-favoring,
# the textbook cause of a PSNR/SSIM that look good while LPIPS lags. This
# config adds a small direct LPIPS loss term (loss.lambda_lpips) on top of
# the existing terms, unchanged otherwise, fine-tuning toward the metric the
# base model was missing on without discarding the 80 epochs of
# pixel/structural convergence already done.
#
# Uses a SEPARATE checkpoint_dir/output_dir from medium_nafnet_a (not
# in-place) specifically so the pre-LPIPS baseline stays intact on disk for
# A/B comparison -- do not point this back at checkpoints/medium_nafnet_a.
seed: 42

paths:
  train_degraded_dir: data/kla/train/degraded
  train_ground_truth_dir: data/kla/train/ground_truth
  validation_degraded_dir: null
  validation_ground_truth_dir: null
  exclude_train_ids_file: null
  checkpoint_dir: checkpoints/medium_nafnet_a_lpips_ft
  output_dir: outputs/medium_nafnet_a_lpips_ft

data:
  scale_factor: 2
  floating_point_scale: 1.0
  metric_data_range: 1.0
  validation_fraction: 0.15
  crop_size_lr: 128
  geometric_augment: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1
  scale_factor: 2
  width: 32
  enc_blocks: [1, 2, 2]
  middle_blocks: 2
  dec_blocks: [2, 2, 1]

loss:
  pixel: charbonnier
  pixel_weight: 1.0
  charbonnier_epsilon: 0.001
  lambda_ssim: 0.10
  lambda_gradient: 0.05
  # Kept low relative to the existing terms: this is a fine-tune of an
  # already-converged model, not a from-scratch run, so the pixel/structural
  # terms stay dominant. See docs/methodology.md before raising it.
  lambda_lpips: 0.05

training:
  # Ignored unless --epochs is omitted from the launch command; the real
  # budget is set via --epochs so it's explicit at the command line. 105
  # is what makes the resumed cosine schedule land at a sensible ~4.9e-5
  # restart LR instead of continuing to anneal toward an already-near-zero
  # epoch-80 value (see docs/methodology.md).
  epochs: 105
  batch_size: 4
  learning_rate: 0.0003
  min_learning_rate: 0.00001
  weight_decay: 0.00001
  amp: false
