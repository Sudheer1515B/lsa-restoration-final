# Observed KLA archive contract: float32 128×128 NoisyLR -> 256×256 GT pairs.
#
# Control for configs/full_texture_sampling_v1.yaml. Identical in every way
# -- same loss, model, training hyperparameters, and crop_size_lr=96 -- except
# texture_aware_sampling is left at its default (off), so every crop position
# is plain uniform-random within the source image.
#
# Exists so "does patch-based training alone help" (this config vs.
# configs/charbonnier_ssim.yaml, which trains at crop_size_lr=128, i.e. no
# real cropping) can be told apart from "does texture-aware position
# selection add anything beyond plain patching" (full_texture_sampling_v1.yaml
# vs. this config). See full_texture_sampling_v1.yaml's header for the full
# three-way comparison.
seed: 42

paths:
  train_degraded_dir: data/kla/train/degraded
  train_ground_truth_dir: data/kla/train/ground_truth
  # Test_NoisyLR shares some filename stems with train.zip but its images are
  # not aligned to those GT arrays, so it is unpaired inference-only data.
  validation_degraded_dir: null
  validation_ground_truth_dir: null
  exclude_train_ids_file: null
  checkpoint_dir: checkpoints/full_random_crop_control_v1
  output_dir: outputs/full_random_crop_control_v1

data:
  scale_factor: 2
  floating_point_scale: 1.0
  metric_data_range: 1.0
  validation_fraction: 0.15
  crop_size_lr: 96
  geometric_augment: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1
  scale_factor: 2
  width: 16
  enc_blocks: [1, 1, 1]
  middle_blocks: 1
  dec_blocks: [1, 1, 1]

loss:
  pixel: charbonnier
  pixel_weight: 1.0
  charbonnier_epsilon: 0.001
  lambda_ssim: 0.2

training:
  epochs: 15
  batch_size: 4
  learning_rate: 0.0003
  min_learning_rate: 0.00001
  weight_decay: 0.00001
  amp: false
