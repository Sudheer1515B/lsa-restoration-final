# Observed KLA archive contract: float32 128×128 NoisyLR -> 256×256 GT pairs.
#
# Same as configs/charbonnier_ssim.yaml, with one variable changed: adds
# `lambda_gradient`, an L1 penalty on the difference between Sobel-filtered
# prediction and target (see losses.sobel_gradient_loss). Plain pixel and
# SSIM losses can average several plausible high-frequency outputs, which is
# perceived as blur; this term rewards matching edge location/strength
# directly instead of relying on the other terms to reproduce edges as a
# side effect. Start at a low weight -- too high causes ringing, sharpened
# noise, and false edges -- and compare against configs/charbonnier_ssim.yaml
# and configs/charbonnier_ssim_hard.yaml using the same frozen validation
# split: check the high-noise-third PSNR/SSIM in training_history.csv and the
# worst-ranked panels, not gradient-loss value alone.
seed: 42

paths:
  train_degraded_dir: data/kla/train/degraded
  train_ground_truth_dir: data/kla/train/ground_truth
  # Test_NoisyLR shares some filename stems with train.zip but its images are
  # not aligned to those GT arrays, so it is unpaired inference-only data.
  validation_degraded_dir: null
  validation_ground_truth_dir: null
  exclude_train_ids_file: null
  checkpoint_dir: checkpoints/charbonnier_ssim_sobel
  output_dir: outputs/charbonnier_ssim_sobel

data:
  scale_factor: 2
  floating_point_scale: 1.0
  metric_data_range: 1.0
  validation_fraction: 0.15
  crop_size_lr: 128
  geometric_augment: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1
  scale_factor: 2
  width: 16
  enc_blocks: [1, 1, 1]
  middle_blocks: 1
  dec_blocks: [1, 1, 1]

loss:
  pixel: charbonnier
  pixel_weight: 1.0
  charbonnier_epsilon: 0.001
  lambda_ssim: 0.10
  lambda_gradient: 0.05

training:
  epochs: 5
  batch_size: 4
  learning_rate: 0.0003
  min_learning_rate: 0.00001
  weight_decay: 0.00001
  amp: false
