# Observed KLA archive contract: float32 128×128 NoisyLR -> 256×256 GT pairs.
#
# Capacity-scaling step 2 ("Medium A" -- see docs/methodology.md for the full
# ladder and rationale). Identical to configs/charbonnier_ssim_sobel.yaml
# -- same loss, crop size, epochs, LR, batch size, seed, validation split --
# except the model block: 291,316 -> 1,905,764 params (~6.5x). Adds more
# NAFBlocks per existing encoder/decoder stage (plus a deeper bottleneck) as
# well as width. This is NOT a deeper spatial hierarchy -- enc_blocks stays
# length 3, so padder_size (2 ** len(enc_blocks), see model/nafnet_sr.py) and
# the number of downsampling steps are unchanged from the baseline. The
# receptive-field gain comes from stacking more 3x3-kernel blocks at each of
# the same three resolutions, which should matter more than plain width
# (configs/width_bump_v1.yaml) for recovering texture that depends on wider
# spatial context (e.g. repeating structure, leaf/branch patterns).
#
# Only run configs/medium_nafnet_b.yaml after this if train/val loss here are
# still both improving at the epoch budget's end (real evidence of remaining
# underfit), not just because bigger might be better.
seed: 42

paths:
  train_degraded_dir: data/kla/train/degraded
  train_ground_truth_dir: data/kla/train/ground_truth
  # Test_NoisyLR shares some filename stems with train.zip but its images are
  # not aligned to those GT arrays, so it is unpaired inference-only data.
  validation_degraded_dir: null
  validation_ground_truth_dir: null
  exclude_train_ids_file: null
  checkpoint_dir: checkpoints/medium_nafnet_a
  output_dir: outputs/medium_nafnet_a

data:
  scale_factor: 2
  floating_point_scale: 1.0
  metric_data_range: 1.0
  validation_fraction: 0.15
  crop_size_lr: 128
  geometric_augment: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1
  scale_factor: 2
  width: 32
  enc_blocks: [1, 2, 2]
  middle_blocks: 2
  dec_blocks: [2, 2, 1]

loss:
  pixel: charbonnier
  pixel_weight: 1.0
  charbonnier_epsilon: 0.001
  lambda_ssim: 0.10
  lambda_gradient: 0.05

training:
  epochs: 5
  batch_size: 4
  learning_rate: 0.0003
  min_learning_rate: 0.00001
  weight_decay: 0.00001
  amp: false
