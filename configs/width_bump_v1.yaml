# Observed KLA archive contract: float32 128×128 NoisyLR -> 256×256 GT pairs.
#
# Capacity-scaling step 1 (see docs/methodology.md for the full ladder and
# rationale). Identical to configs/charbonnier_ssim_sobel.yaml -- same loss,
# crop size, epochs, LR, batch size, seed, validation split --
# except `model.width` goes from 16 to 24 (291,316 -> 645,676 params, ~2.2x).
# enc_blocks/middle_blocks/dec_blocks are unchanged, so this widens every
# channel count without adding depth or changing the receptive field: the
# cheapest possible test of whether the model is capacity-limited at all,
# before committing to Medium A's larger shape below.
#
# Compare against charbonnier_ssim_sobel on the same frozen validation split:
# overall PSNR/SSIM, high-noise-third PSNR/SSIM in training_history.csv, the
# worst-ranked panels (especially whether sample 002475's leaf/static blur
# actually sharpens), and val inference time -- not the headline metric alone.
seed: 42

paths:
  train_degraded_dir: data/kla/train/degraded
  train_ground_truth_dir: data/kla/train/ground_truth
  # Test_NoisyLR shares some filename stems with train.zip but its images are
  # not aligned to those GT arrays, so it is unpaired inference-only data.
  validation_degraded_dir: null
  validation_ground_truth_dir: null
  exclude_train_ids_file: null
  checkpoint_dir: checkpoints/width_bump_v1
  output_dir: outputs/width_bump_v1

data:
  scale_factor: 2
  floating_point_scale: 1.0
  metric_data_range: 1.0
  validation_fraction: 0.15
  crop_size_lr: 128
  geometric_augment: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1
  scale_factor: 2
  width: 24
  enc_blocks: [1, 1, 1]
  middle_blocks: 1
  dec_blocks: [1, 1, 1]

loss:
  pixel: charbonnier
  pixel_weight: 1.0
  charbonnier_epsilon: 0.001
  lambda_ssim: 0.10
  lambda_gradient: 0.05

training:
  epochs: 5
  batch_size: 4
  learning_rate: 0.0003
  min_learning_rate: 0.00001
  weight_decay: 0.00001
  amp: false
