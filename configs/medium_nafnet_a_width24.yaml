# Observed KLA archive contract: float32 128×128 NoisyLR -> 256×256 GT pairs.
#
# Cheaper variant of configs/medium_nafnet_a.yaml:
# identical block shape (enc_blocks/middle_blocks/dec_blocks), just width 24
# instead of 32 -- 1,080,844 params (~3.7x baseline) instead of 1,905,764
# (~6.5x). Use this instead of medium_nafnet_a.yaml if 1.9M params feels too
# large a jump from configs/width_bump_v1.yaml. Everything else (loss, crop
# size, epochs, LR, batch size, seed, validation split) matches
# configs/charbonnier_ssim_sobel.yaml, same as every other config in this
# ladder.
seed: 42

paths:
  train_degraded_dir: data/kla/train/degraded
  train_ground_truth_dir: data/kla/train/ground_truth
  # Test_NoisyLR shares some filename stems with train.zip but its images are
  # not aligned to those GT arrays, so it is unpaired inference-only data.
  validation_degraded_dir: null
  validation_ground_truth_dir: null
  exclude_train_ids_file: null
  checkpoint_dir: checkpoints/medium_nafnet_a_width24
  output_dir: outputs/medium_nafnet_a_width24

data:
  scale_factor: 2
  floating_point_scale: 1.0
  metric_data_range: 1.0
  validation_fraction: 0.15
  crop_size_lr: 128
  geometric_augment: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1
  scale_factor: 2
  width: 24
  enc_blocks: [1, 2, 2]
  middle_blocks: 2
  dec_blocks: [2, 2, 1]

loss:
  pixel: charbonnier
  pixel_weight: 1.0
  charbonnier_epsilon: 0.001
  lambda_ssim: 0.10
  lambda_gradient: 0.05

training:
  epochs: 5
  batch_size: 4
  learning_rate: 0.0003
  min_learning_rate: 0.00001
  weight_decay: 0.00001
  amp: false
